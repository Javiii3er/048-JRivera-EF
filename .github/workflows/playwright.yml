name: Pruebas Playwright

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pruebas:
    name: Suite en Chromium y Firefox
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar navegadores
        run: npx playwright install --with-deps chromium

      - name: Verificar tipos de TypeScript
        run: npx tsc --noEmit

      - name: Ejecutar la suite
        run: npx playwright test

      - name: Guardar el reporte HTML
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: reporte-playwright
          path: playwright-report/
          retention-days: 14
